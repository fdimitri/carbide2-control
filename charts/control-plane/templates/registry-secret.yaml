{{- if and .Values.registry.pullSecret .Values.registry.username .Values.registry.password }}
{{- /*
  The imagePullSecret for this chart's own pods.

  A pull secret is namespace-scoped and the kubelet reads credentials only from
  the pod's own namespace, so the operator's copy in ws-<project_id> cannot
  serve the control plane. This is operator/object_builders/registry_secret.rb
  rendered for the release namespace instead: same type, same auths shape, same
  values -- registry.username / registry.password -- so there is one credential
  and one secret name, not two mechanisms.

  A pre-install/pre-upgrade hook at a NEGATIVE weight, because job-migrate is a
  pre-upgrade hook at weight 0 and pulls this same image. Rendered as an
  ordinary resource it would be applied after that hook and the migrate Job
  would still ImagePullBackOff. before-hook-creation (and no hook-succeeded)
  keeps it in place for the Deployments that come after.
*/}}
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: {{ .Values.registry.pullSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  .dockerconfigjson: {{ dict "auths" (dict (include "control-plane.registryHost" .) (dict
      "username" .Values.registry.username
      "password" .Values.registry.password
      "auth" (printf "%s:%s" .Values.registry.username .Values.registry.password | b64enc)
    )) | toJson | b64enc | quote }}
{{- end }}
