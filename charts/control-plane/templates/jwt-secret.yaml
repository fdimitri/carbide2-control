{{- /* Shared JWT secret. Mirrored into every workspace namespace by the operator. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace .Values.jwt.secretName) }}
{{- $existingSecret := "" }}
{{- if $existing }}{{ $existingSecret = (index $existing.data "secret" | default "" | b64dec) }}{{- end }}
{{- $secret := default (default (randAlphaNum 64) .Values.jwt.secret) $existingSecret }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.jwt.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
data:
  secret: {{ $secret | b64enc | quote }}
