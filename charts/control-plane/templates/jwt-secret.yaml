{{- /* Shared JWT signing key. This must be an RSA PEM, minted by deploy.rb's
       Carbide::JwtKey before helm install. The chart does NOT generate a key —
       a random alphanumeric value would crash Rails (OpenSSL::PKey::RSA.new).
       Fail the render if no key was provided and none already exists. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace .Values.jwt.secretName) }}
{{- $existingSecret := "" }}
{{- if $existing }}{{ $existingSecret = (index $existing.data "secret" | default "" | b64dec) }}{{- end }}
{{- $secret := default .Values.jwt.secret $existingSecret }}
{{- if not $secret }}
  {{- fail (printf "jwt.secret is empty and no existing Secret %s exists. Run deploy.rb (Carbide::JwtKey) to mint an RSA signing key before helm install." .Values.jwt.secretName) }}
{{- end }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.jwt.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
data:
  secret: {{ $secret | b64enc | quote }}
