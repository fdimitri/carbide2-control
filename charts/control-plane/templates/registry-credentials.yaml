{{- if .Values.registry.username }}
{{- /*
  Raw username/password for the control-plane pods' env (REGISTRY_USERNAME /
  REGISTRY_PASSWORD). Separate from the dockerconfigjson pull secret in
  registry-secret.yaml: the kubelet reads a docker config, the pods read env
  vars, and one Secret cannot be both types.

  Values win, deliberately and permanently. deploy.rb has to be able to repair
  the registry configuration from outside the cluster, and overwriting this
  Secret is how it does so. If control itself ever learns to write it, a deploy
  still overwrites it -- the host stays the out-of-band fix path. Do not invert
  this to existing-wins.

  This is also what keeps the credential out of the pod specs: `kubectl get
  deploy -o yaml` shows the secretKeyRef, not the token.

  Rendered as an ordinary resource (no hook annotations, unlike
  registry-secret.yaml) -- only the Deployments consume it, and those are
  applied after hooks.
*/}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.registry.credentialsSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
data:
  username: {{ .Values.registry.username | b64enc | quote }}
  password: {{ .Values.registry.password | b64enc | quote }}
{{- end }}
