{{- if .Values.ingress.enabled }}
{{- $eps := .Values.ingress.entryPoints -}}
{{- /* HTTPS is forced when both web and websecure are served: web only
       redirects, websecure serves. A tls block makes a router TLS-only, so the
       real routes must NOT be exposed on the plaintext web entrypoint. */ -}}
{{- $forceHttps := and (has "websecure" $eps) (has "web" $eps) -}}
{{- $servingEps := $eps -}}
{{- if $forceHttps -}}{{- $servingEps = list "websecure" -}}{{- end -}}
{{- if ne .Values.ingress.pathPrefix "/" }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "control-plane.fullname" . }}-stripprefix
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - {{ .Values.ingress.pathPrefix | quote }}
---
{{- end }}
{{- if $forceHttps }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "control-plane.fullname" . }}-https-redirect
  namespace: {{ .Release.Namespace }}
spec:
  # Force HTTPS: 301 every plain HTTP request up to the secure scheme. The port
  # is explicit because the public HTTPS port may differ from Traefik's internal
  # exposedPort (e.g. 8443 in the k3d dev cluster).
  redirectScheme:
    scheme: https
    port: {{ .Values.ingress.publicHttpsPort | default 8443 | quote }}
    permanent: true
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "control-plane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml $servingEps | nindent 4 }}
{{- if has "websecure" $servingEps }}
  tls:
    {{- toYaml (.Values.ingress.tls | default dict) | nindent 4 }}
{{- end }}
  routes:
    - match: {{ if .Values.ingress.host }}Host(`{{ .Values.ingress.host }}`) && {{ end }}PathPrefix(`{{ .Values.ingress.pathPrefix }}`)
      kind: Rule
      priority: 1
      services:
        - name: {{ include "control-plane.fullname" . }}
          port: {{ .Values.rails.port }}
{{- if ne .Values.ingress.pathPrefix "/" }}
      middlewares:
        - name: {{ include "control-plane.fullname" . }}-stripprefix
{{- end }}
{{- if $forceHttps }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "control-plane.fullname" . }}-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
spec:
  # Web (plaintext) entrypoint: 301-redirect everything up to HTTPS. The route
  # names a service only because Traefik requires one; the redirect middleware
  # short-circuits before the backend is reached.
  entryPoints:
    - web
  routes:
    - match: {{ if .Values.ingress.host }}Host(`{{ .Values.ingress.host }}`) && {{ end }}PathPrefix(`{{ .Values.ingress.pathPrefix }}`)
      kind: Rule
      priority: 1
      services:
        - name: {{ include "control-plane.fullname" . }}
          port: {{ .Values.rails.port }}
      middlewares:
        - name: {{ include "control-plane.fullname" . }}-https-redirect
{{- end }}
{{- end }}
